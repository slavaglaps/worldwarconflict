<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World War Conflict — Lobby</title>
<style>
  @font-face{font-family:KnightsQuest;src:url('assets/fonts/KnightsQuest.ttf') format('truetype');font-display:swap}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;font-family:KnightsQuest,Georgia,serif;color:#e9efe8;
    background:
      radial-gradient(circle at 50% 22%,rgba(90,114,92,.24),transparent 36%),
      radial-gradient(circle at 14% 86%,rgba(98,78,38,.22),transparent 31%),
      linear-gradient(180deg,#101b1c 0%,#091012 58%,#05080a 100%)}
  body{display:flex;align-items:center;justify-content:center;padding:22px;overflow-x:hidden}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background:
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px);background-size:72px 72px}
  .wrap{position:relative;width:min(1180px,96vw);min-height:min(760px,94vh);padding:30px 34px 32px;
    border:1px solid rgba(197,166,103,.48);border-radius:3px;background:linear-gradient(180deg,rgba(24,35,31,.94),rgba(8,14,15,.97));
    box-shadow:0 24px 90px rgba(0,0,0,.72),inset 0 0 0 1px rgba(255,236,181,.08)}
  .wrap:before{content:"";position:absolute;inset:10px;border:1px solid rgba(197,166,103,.18);pointer-events:none}
  .wrap:after{content:"";position:absolute;left:22px;right:22px;top:110px;height:1px;background:linear-gradient(90deg,transparent,rgba(197,166,103,.48),transparent);pointer-events:none}
  .head{position:relative;z-index:1;display:grid;grid-template-columns:92px 1fr 92px;align-items:center;gap:22px;margin-bottom:38px}
  .crest{width:82px;height:82px;border:1px solid rgba(199,171,109,.7);clip-path:polygon(50% 0,92% 22%,92% 74%,50% 100%,8% 74%,8% 22%);
    display:grid;place-items:center;background:linear-gradient(180deg,rgba(30,46,41,.96),rgba(10,18,18,.98));box-shadow:inset 0 0 24px rgba(199,171,109,.08)}
  .crest svg{width:48px;height:48px;stroke:#d2b46d;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .title{text-align:center;font-family:KnightsQuest,Georgia,serif;font-size:48px;line-height:1;letter-spacing:.9px;text-transform:uppercase;color:#efe7d4;text-shadow:0 4px 18px rgba(0,0,0,.86)}
  .sub{text-align:center;color:#a9b59d;font-weight:700;font-size:14px;letter-spacing:.8px;text-transform:uppercase;margin-top:9px}
  .status{justify-self:end;min-width:188px;padding:10px 13px;border:1px solid rgba(151,130,83,.58);border-radius:3px;background:rgba(8,14,13,.66);
    color:#aeb9ad;font-size:15px;font-weight:800;line-height:1.35;text-align:center;text-transform:uppercase;letter-spacing:.55px}
  .status.ok{color:#91d49b;border-color:rgba(96,159,92,.62)} .status.err{color:#e98b7c;border-color:rgba(185,85,69,.62)}
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(300px,360px) minmax(560px,1fr);gap:22px;align-items:start}
  .leftStack{display:flex;flex-direction:column;gap:18px}
  .card{position:relative;border:1px solid rgba(157,138,92,.44);border-radius:3px;padding:18px;background:
    linear-gradient(180deg,rgba(23,36,34,.78),rgba(9,16,16,.88));box-shadow:0 12px 34px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,236,181,.035)}
  .card:before{content:"";position:absolute;inset:6px;border:1px solid rgba(197,166,103,.12);pointer-events:none}
  .card h2{position:relative;z-index:1;margin-bottom:15px;font-family:KnightsQuest,Georgia,serif;font-size:25px;font-weight:700;letter-spacing:.5px;color:#d7c394;text-transform:uppercase;text-shadow:0 2px 9px #000}
  .row{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
  input{width:100%;height:54px;background:rgba(8,15,17,.82);border:1px solid rgba(84,103,92,.8);border-radius:3px;color:#edf2ec;
    padding:0 15px;font-family:KnightsQuest,Georgia,serif;font-size:19px;font-weight:700;outline:none;box-shadow:inset 0 2px 10px rgba(0,0,0,.28)}
  input::placeholder{color:#738273}
  input:focus{border-color:#d2b46d;box-shadow:0 0 0 2px rgba(210,180,109,.14),inset 0 2px 10px rgba(0,0,0,.28)}
  button{height:54px;border:1px solid rgba(207,171,101,.78);clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);
    background:linear-gradient(180deg,rgba(42,70,57,.96),rgba(13,35,28,.98));color:#ecd69d;font-family:KnightsQuest,Georgia,serif;
    font-size:22px;font-weight:700;letter-spacing:.35px;text-shadow:0 2px 7px #000;cursor:pointer;padding:0 26px;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.34)}
  button:hover{border-color:#f0d480;box-shadow:0 0 20px rgba(232,199,104,.22),0 12px 30px rgba(0,0,0,.48)}
  button:disabled{opacity:.48;cursor:default;filter:saturate(.55)}
  button.ghost{height:44px;min-width:124px;background:linear-gradient(180deg,rgba(26,44,52,.94),rgba(9,21,25,.98));color:#c9d8d6;border-color:rgba(108,139,144,.58);font-size:18px}
  .rooms{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding-right:5px;scrollbar-color:rgba(190,162,111,.45) rgba(0,0,0,.18)}
  .rm{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:72px;border:1px solid rgba(84,103,92,.58);border-radius:3px;padding:12px 14px;
    background:linear-gradient(180deg,rgba(13,24,27,.88),rgba(7,14,16,.92));box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
  .rm:hover{border-color:rgba(199,171,109,.62);background:linear-gradient(180deg,rgba(20,34,35,.9),rgba(8,16,18,.94))}
  .rm .nm{font-family:KnightsQuest,Georgia,serif;font-size:23px;color:#efe2c4;letter-spacing:.35px;text-shadow:0 2px 9px #000}
  .rm .meta{color:#9ca99a;font-size:16px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;margin-top:4px}
  .rm .full{color:#df9078}
  .empty{min-height:190px;display:grid;place-items:center;text-align:center;color:#8f9b8e;font-family:KnightsQuest,Georgia,serif;font-size:23px;border:1px dashed rgba(151,130,83,.32);background:rgba(8,14,13,.42)}
  .pill{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:25px;margin-left:8px;padding:0 10px;border:1px solid rgba(207,171,101,.54);
    background:rgba(8,14,13,.82);color:#f1d88f;font-size:17px;font-family:KnightsQuest,Georgia,serif}
  .quick{position:relative;z-index:1;margin-top:14px;color:#8f9b8e;font-size:12px;font-weight:800;line-height:1.5;text-transform:uppercase;letter-spacing:.5px}
  @media(max-width:820px){
    body{align-items:flex-start;padding:12px}
    .wrap{min-height:calc(100vh - 24px);padding:20px 16px}
    .head{grid-template-columns:1fr;gap:10px;margin-bottom:26px}
    .crest{justify-self:center;width:68px;height:68px}
    .title{font-size:34px}
    .status{justify-self:stretch;min-width:0}
    .grid{grid-template-columns:1fr}
    .rooms{max-height:42vh}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="crest" aria-hidden="true">
      <svg viewBox="0 0 48 48"><path d="M24 6v36M11 17h26M15 11l18 26M33 11 15 37"/></svg>
    </div>
    <div>
      <div class="title">World War Conflict</div>
    </div>
    <div class="status" id="status">connecting...</div>
  </div>

  <div class="grid">
    <div class="leftStack">
      <div class="card">
        <h2>Create Room</h2>
        <div class="row">
          <input id="roomName" placeholder="Room name" maxlength="40">
          <button id="createBtn">Create</button>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <button id="tutBtn">Tutorial</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Active Rooms <span class="pill" id="count">0</span></h2>
      <div class="rooms" id="rooms"></div>
    </div>
  </div>
</div>

<script src="vendor/colyseus.js"></script>
<script>
(function(){
  // Endpoint: localhost uses local :2567, everything else uses production Colyseus Cloud. ?cs=wss://... overrides.
  const params = new URLSearchParams(location.search);
  const PROD = 'wss://de-fra-fe578df7.colyseus.cloud';
  const isLocal = location.hostname==='localhost' || location.hostname==='127.0.0.1';
  const csVal = params.get('cs');
  const ENDPOINT = (csVal && /^wss?:\/\//.test(csVal)) ? csVal : (isLocal ? ('ws://'+location.hostname+':2567') : PROD);

  const $ = id => document.getElementById(id);
  const statusEl = $('status'), roomsEl = $('rooms'), countEl = $('count');
  const rooms = new Map();   // roomId -> listing
  let client = null, lobby = null;

  function setStatus(t, cls){ statusEl.textContent = t; statusEl.className = 'status' + (cls?' '+cls:''); }

  // Tutorial starts the solo game with the forced onboarding flow.
  $('tutBtn').onclick = () => { location.href = 'game-hex.html?tut=1'; };

  // Create room: game-hex.html creates it with this name.
  $('createBtn').onclick = () => {
    const name = ($('roomName').value || '').trim() || ('Game-' + Math.random().toString(36).slice(2,6));
    location.href = 'game-hex.html?cs=1&create=1&mp=' + encodeURIComponent(name);
  };
  $('roomName').addEventListener('keydown', e => { if(e.key==='Enter') $('createBtn').click(); });

  function render(){
    const list = [...rooms.values()].filter(r => r.name === 'game');
    countEl.textContent = list.length;
    if(!list.length){ roomsEl.innerHTML = '<div class="empty">No active rooms</div>'; return; }
    roomsEl.innerHTML = '';
    list.sort((a,b)=> (b.clients||0)-(a.clients||0));
    for(const r of list){
      const nm = (r.metadata && r.metadata.name) || 'Game';
      const cur = r.clients||0, max = r.maxClients||24, full = cur>=max;
      const el = document.createElement('div'); el.className='rm';
      el.innerHTML = `<div><div class="nm">${escapeHtml(nm)}</div>
        <div class="meta"><b class="${full?'full':''}">${cur}/${max}</b> players${(r.metadata&&r.metadata.over)?' · finished':''}</div></div>`;
      const btn = document.createElement('button');
      btn.className='ghost'; btn.textContent = full ? 'Full' : 'Join'; btn.disabled = full;
      btn.onclick = () => { location.href = 'game-hex.html?cs=1&rid=' + encodeURIComponent(r.roomId); };
      el.appendChild(btn);
      roomsEl.appendChild(el);
    }
  }
  const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function connect(){
    try{
      client = new Colyseus.Client(ENDPOINT);
      lobby = await client.joinOrCreate('lobby');
      setStatus('online · live rooms', 'ok');
      lobby.onMessage('rooms', (all) => { rooms.clear(); all.forEach(r => rooms.set(r.roomId, r)); render(); });
      lobby.onMessage('+', ([roomId, room]) => { rooms.set(roomId, room); render(); });
      lobby.onMessage('-', (roomId) => { rooms.delete(roomId); render(); });
      lobby.onLeave(() => setStatus('connection lost · refresh', 'err'));
      render();
    }catch(e){
      setStatus('server unavailable: ' + (e.message||e), 'err');
      render();
      console.error(e);
    }
  }
  render();
  connect();
})();
</script>
</body>
</html>
